[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "woman-revamp"
version = "0.1.0"
description = "Local command registry and scoring engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["rich>=13.0.0", "questionary>=2.0.0"]
ml = ["joblib>=1.4.0", "pandas>=2.2.0", "scikit-learn>=1.5.0"]
test = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "pytest-mock>=3.14.0"]
full = ["woman-revamp[ui,ml]"]

[project.scripts]
woman = "woman_revamp.entrypoint:main"
woman-revamp = "woman_revamp.entrypoint:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["woman_revamp*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = "woman_revamp"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
strict_optional = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
